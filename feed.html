<title>DescobreAqui</title>
<style>
:root {
  --ig-bg: #000;
  --ig-text: #f5f5f5;
  --ig-secondary: #a8a8a8;
  --ig-border: #262626;
}

/* ================= APP ================= */

html { background: #000; }

body {
  background: #000;
  color: var(--ig-text);
  width: 100%;
  max-width: 470px;
  min-height: 100vh;
  margin: 0 auto;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  overflow-x: hidden;
}

@media (min-width: 600px) {
  body {
    border-left: 1px solid #1c1c1c;
    border-right: 1px solid #1c1c1c;
  }
}

* { box-sizing: border-box; }

button { font-family: inherit; }

/* ================= HEADER ================= */

.ig-header {
  position: fixed;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 470px;
  height: 50px;
  padding: 0 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(0,0,0,.97);
  border-bottom: 1px solid rgba(255,255,255,.04);
  z-index: 50;
}

.ig-logo {
  display: flex;
  align-items: center;
  height: 32px;
}

.ig-logo svg {
  height: 32px;
  width: auto;
  fill: #fff;
}

.header-icons {
  display: flex;
  align-items: center;
  gap: 20px;
}

.icon-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  background: none;
  border: none;
  cursor: pointer;
  padding: 0;
  color: var(--ig-text);
}

.icon-btn svg {
  width: 25px;
  height: 25px;
}

/* ================= STORIES ================= */

.stories-section {
  padding-top: 50px;
  background: #000;
  border-bottom: 1px solid var(--ig-border);
}

.stories-scroll {
  display: flex;
  gap: 12px;
  padding: 10px 10px 12px;
  overflow-x: auto;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}

.stories-scroll::-webkit-scrollbar { display: none; }

.story-item { flex-shrink: 0; }

.story-ring {
  position: relative;
  width: 66px;
  height: 66px;
  padding: 2px;
  border-radius: 50%;
  background: linear-gradient(45deg, #feda75 0%, #fa7e1e 25%, #d62976 50%, #962fbf 75%, #4f5bd5 100%);
}

.story-ring.own { background: #343434; }
.story-ring.close-friend { background: linear-gradient(45deg, #6bc26b 0%, #3dbd3d 50%, #2ecc71 100%); }

.story-img-wrap {
  width: 100%;
  height: 100%;
  border: 2px solid #000;
  border-radius: 50%;
  overflow: hidden;
}

.story-img-wrap img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.story-img-wrap img.blurred {
  filter: none;
  transform: scale(1);
}

.story-name {
  width: 68px;
  max-width: 68px;
  margin-top: 2px;
  text-align: center;
  font-size: 11px;
  line-height: 13px;
  color: #f5f5f5;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.plus-badge {
  position: absolute;
  right: -1px;
  bottom: -1px;
  width: 20px;
  height: 20px;
  background: #0095f6;
  border-radius: 50%;
  border: 2px solid #000;
  display: flex;
  align-items: center;
  justify-content: center;
}

/* ================= FEED ================= */

.feed-posts {
  padding-bottom: 110px;
  background: #000;
}

/* ================= POST ================= */

.post {
  width: 100%;
  padding-bottom: 9px;
  background: #000;
  border-bottom: 1px solid var(--ig-border);
}

.post-header {
  min-height: 48px;
  padding: 8px 12px;
  display: flex;
  align-items: center;
  gap: 9px;
}

.post-avatar {
  width: 33px;
  height: 33px;
  flex-shrink: 0;
  border-radius: 50%;
  overflow: hidden;
}

.post-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  filter: none;
  transform: scale(1);
}

.post-info { flex: 1; min-width: 0; }

.post-username {
  font-size: 13px;
  line-height: 16px;
  font-weight: 600;
  color: #fff;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}

.post-location {
  display: block;
  margin-top: 1px;
  font-size: 10px;
  line-height: 13px;
  font-weight: 400;
  color: #dedede;
}

.post-more {
  padding: 5px;
  background: none;
  border: none;
  cursor: pointer;
  color: var(--ig-text);
}

.post-more svg { width: 18px; height: 18px; }

/* ================= IMAGEM ================= */

.post-image-wrap {
  position: relative;
  width: 100%;
  aspect-ratio: 4 / 5;
  overflow: hidden;
  background: #101010;
  cursor: pointer;
}

.post-image-bg {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  filter: none !important;
  transform: scale(1) !important;
  transition: filter .35s ease, transform .35s ease;
}

.post-image-overlay {
  display: none;
}

.post-image-overlay svg {
  width: 32px;
  height: 32px;
  color: rgba(255,255,255,.9);
  filter: drop-shadow(0 2px 5px rgba(0,0,0,.5));
}

.post-image-overlay span {
  font-size: 12px;
  font-weight: 500;
  color: rgba(255,255,255,.9);
}

.post-unlock-btn {
  display: none;
}

@media (hover:hover) {
  .post-image-wrap:hover .post-image-bg {
    filter: none !important;
    transform: scale(1.02) !important;
  }
}

@media (hover:none) {
}

/* ================= AÇÕES ================= */

.post-actions {
  height: 45px;
  padding: 8px 12px 3px;
  display: flex;
  align-items: center;
  gap: 16px;
}

.post-actions svg {
  width: 25px;
  height: 25px;
  stroke-width: 1.8;
}

.post-actions .spacer { flex: 1; }

/* ================= INFORMAÇÕES ================= */

.post-likes {
  padding: 1px 12px 0;
  font-size: 13px;
  line-height: 18px;
  font-weight: 600;
  color: #fff;
}

.post-caption {
  padding: 2px 12px 0;
  font-size: 13px;
  line-height: 18px;
  color: #f5f5f5;
}

.post-caption b {
  margin-right: 3px;
  font-weight: 600;
  color: #fff;
}

.post-comments {
  padding: 2px 12px 0;
  font-size: 13px;
  line-height: 18px;
  color: #a8a8a8;
}

.post-add-comment {
  padding: 2px 12px 0;
  font-size: 13px;
  line-height: 18px;
  color: #737373;
}

.post-translation {
  padding: 3px 12px 0;
  font-size: 11px;
  font-weight: 600;
  color: #f5f5f5;
}

.post-time {
  padding: 5px 12px 7px;
  font-size: 10px;
  color: #737373;
  text-transform: uppercase;
}

/* ================= BOTTOM NAV ================= */

.bottom-nav {
  position: fixed;
  left: 50%;
  bottom: 24px;
  transform: translateX(-50%) scale(1);
  width: auto;
  padding: 10px 22px;
  display: flex;
  align-items: center;
  gap: 6px;
  background: rgba(18,18,18,0.92);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-radius: 50px;
  z-index: 60;
  box-shadow: 0 4px 24px rgba(0,0,0,0.55);
  transition: transform 0.3s ease, bottom 0.3s ease, opacity 0.3s ease;
  border-top: 0.5px solid rgba(255,255,255,0.18);
  border-left: 0.5px solid rgba(255,255,255,0.08);
  border-right: 0.5px solid rgba(255,255,255,0.08);
  border-bottom: 0.5px solid rgba(255,255,255,0.03);
  overflow: hidden;
}

.bottom-nav::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 1px;
  background: linear-gradient(90deg, transparent 0%, rgba(255,255,255,0.25) 20%, rgba(255,255,255,0.35) 50%, rgba(255,255,255,0.25) 80%, transparent 100%);
  pointer-events: none;
  z-index: 1;
}

.bottom-nav::after {
  content: '';
  position: absolute;
  top: 1px;
  left: 0;
  right: 0;
  height: 45%;
  background: linear-gradient(180deg, rgba(255,255,255,0.07) 0%, transparent 100%);
  border-radius: 50px 50px 0 0;
  pointer-events: none;
}

.bottom-nav.nav-hidden {
  bottom: 10px;
  transform: translateX(-50%) scale(0.92);
  opacity: 0.6;
}

.nav-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  background: none;
  border: none;
  cursor: pointer;
  padding: 10px 14px;
  color: var(--ig-text);
  border-radius: 40px;
  position: relative;
  transition: background 0.18s ease, transform 0.15s ease;
}

.nav-btn:active {
  transform: scale(0.85);
}

.nav-btn:first-child {
  background: rgba(255,255,255,0.13);
}

.nav-btn svg { width: 25px; height: 25px; }

.nav-profile {
  width: 25px;
  height: 25px;
  border-radius: 50%;
  object-fit: cover;
  border: 1.5px solid rgba(255,255,255,0.3);
  display: block;
}

.nav-dot {
  position: absolute;
  bottom: 8px;
  right: 10px;
  width: 7px;
  height: 7px;
  background: #ff3040;
  border-radius: 50%;
  border: 1.5px solid rgba(18,18,18,0.92);
}

/* ================= PREVIEW ================= */

.preview-banner {
  width: 100%;
  padding: 12px 14px;
  display: flex;
  gap: 10px;
  align-items: center;
  background: linear-gradient(135deg, #0564cc, #069be9);
}

.banner-content { min-width: 0; flex: 1; }

.banner-title {
  font-size: 13px;
  line-height: 16px;
  font-weight: 700;
  color: #fff;
}

.banner-desc {
  margin-top: 3px;
  font-size: 11px;
  line-height: 14px;
  color: rgba(255,255,255,.87);
}

.vip-btn {
  padding: 9px 14px;
  border-radius: 8px;
  font-size: 12px;
  font-weight: 700;
  background: #fff;
  color: #0564cc;
  border: none;
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
}

/* ================= BLUR TEXT ================= */

.blur-text {
  filter: none;
}

/* ================= UNLOCK POPUP ================= */

.unlock-overlay {
  display: none !important;
}

.unlock-overlay.show {
  display: none !important;
}

.unlock-popup {
  background: #1c1c1e;
  border-radius: 16px;
  padding: 28px 24px;
  text-align: center;
  max-width: 320px;
  width: 90%;
  transform: scale(.92);
  transition: transform .25s ease;
}

.unlock-overlay.show .unlock-popup {
  transform: scale(1);
}

.unlock-popup .lock-icon {
  font-size: 40px;
  margin-bottom: 12px;
}

.unlock-popup h3 {
  font-size: 17px;
  font-weight: 700;
  color: #fff;
  margin-bottom: 6px;
}

.unlock-popup p {
  font-size: 13px;
  color: #a8a8a8;
  margin-bottom: 18px;
  line-height: 1.4;
}

.unlock-popup .popup-cta {
  display: block;
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 700;
  color: #fff;
  background: linear-gradient(135deg, #0564cc, #069be9);
  cursor: pointer;
  font-family: inherit;
  margin-bottom: 10px;
}

.unlock-popup .popup-close {
  display: block;
  width: 100%;
  padding: 10px;
  border: none;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 500;
  color: #a8a8a8;
  background: transparent;
  cursor: pointer;
  font-family: inherit;
}

/* ================= UPSELL POPUP ================= */

.upsell-overlay {
  display: none !important;
}

.upsell-overlay.show {
  display: none !important;
}

.upsell-popup {
  background: linear-gradient(135deg, #0f172a 0%, #1e293b 100%);
  border: 1px solid rgba(56,163,212,.4);
  border-radius: 16px;
  max-width: 360px;
  width: 100%;
  padding: 26px 20px;
  text-align: center;
  position: relative;
  animation: upsellIn .35s ease;
}

@keyframes upsellIn {
  from { transform: scale(.85); opacity: 0; }
  to { transform: scale(1); opacity: 1; }
}

.upsell-popup .upsell-close {
  position: absolute;
  top: 10px;
  right: 14px;
  background: none;
  border: none;
  color: #94a3b8;
  font-size: 22px;
  cursor: pointer;
  line-height: 1;
}

.upsell-tag {
  display: inline-block;
  background: linear-gradient(135deg, #ef4444, #f97316);
  color: #fff;
  font-size: 11px;
  font-weight: 700;
  padding: 4px 12px;
  border-radius: 20px;
  letter-spacing: .5px;
  margin-bottom: 12px;
  text-transform: uppercase;
}

.upsell-popup h3 {
  color: #fff;
  font-size: 19px;
  font-weight: 800;
  margin: 0 0 6px;
  line-height: 1.3;
}

.upsell-popup .upsell-sub {
  color: #94a3b8;
  font-size: 13px;
  margin: 0 0 14px;
  line-height: 1.5;
}

.upsell-features {
  list-style: none;
  padding: 0;
  margin: 0 0 16px;
  text-align: left;
}

.upsell-features li {
  color: #cbd5e1;
  font-size: 13px;
  padding: 4px 0;
  display: flex;
  align-items: center;
  gap: 8px;
}

.upsell-features li::before {
  content: '\2705';
  font-size: 13px;
  flex-shrink: 0;
}

.upsell-prices {
  margin-bottom: 14px;
}

.upsell-old {
  color: #64748b;
  text-decoration: line-through;
  font-size: 14px;
}

.upsell-new {
  color: #22c55e;
  font-size: 30px;
  font-weight: 800;
  display: block;
  margin-top: 2px;
}

.upsell-installment {
  color: #94a3b8;
  font-size: 12px;
}

.upsell-btn {
  display: block;
  width: 100%;
  padding: 13px;
  border: none;
  border-radius: 10px;
  background: linear-gradient(135deg, #22c55e, #16a34a);
  color: #fff;
  font-size: 14px;
  font-weight: 700;
  cursor: pointer;
  letter-spacing: .3px;
  margin-bottom: 8px;
  position: relative;
  overflow: hidden;
  font-family: inherit;
}

.upsell-btn::before {
  content: '';
  position: absolute;
  top: 0; left: -100%;
  width: 100%; height: 100%;
  background: linear-gradient(90deg, transparent, rgba(255,255,255,.2), transparent);
  animation: upsellShimmer 2s ease infinite;
}

@keyframes upsellShimmer {
  0% { left: -100%; }
  100% { left: 100%; }
}

.upsell-decline {
  background: none;
  border: none;
  color: #64748b;
  font-size: 12px;
  cursor: pointer;
  text-decoration: underline;
  font-family: inherit;
}

/* ================= MOBILE PEQUENO ================= */

@media (max-width: 360px) {
  .story-ring { width: 62px; height: 62px; }
  .stories-scroll { gap: 10px; }
  .preview-banner { padding: 7px 8px; }
  .banner-desc { font-size: 8px; }
}
</style>
</head>

    var likesStr = likes > 999 ? (likes / 1000).toFixed(3).replace('.', '.').replace(/(\d)(\d{3})$/, '$1.$2') : likes.toString();

    var locHtml = loc ? '<span class="post-location">' + loc + '</span>' : '';

    var html = '<article class="post">' +
      '<div class="post-header">' +
        '<div class="post-avatar"><img src="' + localAvatars[postIndex % localAvatars.length] + '" alt=""></div>' +

        '</div>' +

      '</div>' +

      '<div class="post-time">' + time + '</div>' +
    '</article>';

    postIndex++;
    return html;
  }

  function loadBatch() {
    if (loading) return;
    loading = true;
    var fragment = '';
    for (var i = 0; i < 5; i++) fragment += createPost();
    feed.insertAdjacentHTML('beforeend', fragment);
    loading = false;
  }

  loadBatch();
  loadBatch();

  var postCount = Math.floor(Math.random() * 6) + 10;
  var feedScrollLimit = postCount * window.innerHeight * 1.25;
  var unlockShown = false;
  var upsellTriggered = false;
  var upsellScrollLimit = feedScrollLimit + window.innerHeight * 5;
  var lastScrollY = 0;
  var navEl = document.querySelector('.bottom-nav');
  window.addEventListener('scroll', function () {
    if ((window.innerHeight + window.scrollY) >= document.body.offsetHeight - 800) {
      loadBatch();
    }
    // disabled for criativo version
    var currentY = window.scrollY;
    if (currentY > lastScrollY && currentY > 100) {
      navEl.classList.add('nav-hidden');
    } else {
      navEl.classList.remove('nav-hidden');
    }
    lastScrollY = currentY;
  });
})();
</script>
