<title>DescobreAqui</title>
<style>
:root {
  --ig-bg: #000;
  --ig-surface: #000;
  --ig-text: #f5f5f5;
  --ig-secondary: #a8a8a8;
  --ig-border: #262626;
  --ig-blue: #0095f6;
}

html { background: #000; }

body {
  background: #000;
  color: var(--ig-text);
  width: 100%;
  max-width: 470px;
  min-height: 100vh;
  margin: 0 auto;
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  overflow-x: hidden;
  padding: 0;
}

@media (min-width: 600px) {
  body {
    border-left: 1px solid #1c1c1c;
    border-right: 1px solid #1c1c1c;
  }
}

* { box-sizing: border-box; margin: 0; padding: 0; }
button { font-family: inherit; }

/* ================= HEADER ================= */

.dm-header {
  position: fixed;
  top: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 100%;
  max-width: 470px;
  height: 50px;
  padding: 0 14px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: rgba(0,0,0,.97);
  border-bottom: 1px solid rgba(255,255,255,.04);
  z-index: 50;
}

.dm-header-left {
  display: flex;
  align-items: center;
  gap: 8px;
}

.dm-header-left .icon-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  background: none;
  border: none;
  cursor: pointer;
  padding: 4px;
  color: var(--ig-text);
}

.dm-header-left .icon-btn svg {
  width: 22px;
  height: 22px;
}

.dm-username {
  font-size: 20px;
  font-weight: 700;
  color: #fff;
  display: flex;
  align-items: center;
  gap: 4px;
}

.dm-username svg {
  width: 14px;
  height: 14px;
  margin-top: 2px;
}

.dm-header-right {
  display: flex;
  align-items: center;
  gap: 18px;
}

.dm-header-right .icon-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  background: none;
  border: none;
  cursor: pointer;
  padding: 0;
  color: var(--ig-text);
}

.dm-header-right .icon-btn svg {
  width: 24px;
  height: 24px;
}

/* ================= SEARCH ================= */

.dm-search {
  margin-top: 50px;
  padding: 8px 14px;
}

.dm-search-box {
  width: 100%;
  height: 36px;
  background: #262626;
  border-radius: 10px;
  border: none;
  padding: 0 14px 0 36px;
  font-size: 14px;
  color: #a8a8a8;
  display: flex;
  align-items: center;
  position: relative;
}

.dm-search-box input {
  width: 100%;
  height: 100%;
  background: transparent;
  border: none;
  outline: none;
  color: var(--ig-text);
  font-size: 14px;
  font-family: inherit;
}

.dm-search-box input::placeholder {
  color: #a8a8a8;
}

.dm-search-box svg {
  position: absolute;
  left: 10px;
  top: 50%;
  transform: translateY(-50%);
  width: 16px;
  height: 16px;
  color: #a8a8a8;
}

.dm-filter {
  position: absolute;
  right: 14px;
  top: 50%;
  transform: translateY(-50%);
  font-size: 15px;
  font-weight: 600;
  color: var(--ig-blue);
  background: none;
  border: none;
  cursor: pointer;
  font-family: inherit;
}

/* ================= NOTES / STORIES ROW ================= */

.dm-notes {
  padding: 12px 0 8px;
  border-bottom: 1px solid var(--ig-border);
}

.dm-notes-scroll {
  display: flex;
  gap: 16px;
  padding: 0 14px;
  overflow-x: auto;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}

.dm-notes-scroll::-webkit-scrollbar { display: none; }

.dm-note-item {
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  width: 68px;
}

.dm-note-ring {
  width: 64px;
  height: 64px;
  border-radius: 50%;
  padding: 2px;
  position: relative;
}

.dm-note-ring.has-story {
  background: linear-gradient(45deg, #feda75 0%, #fa7e1e 25%, #d62976 50%, #962fbf 75%, #4f5bd5 100%);
}

.dm-note-ring.has-note {
  background: #343434;
}

.dm-note-avatar {
  width: 100%;
  height: 100%;
  border-radius: 50%;
  border: 2px solid #000;
  overflow: hidden;
}

.dm-note-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.dm-note-avatar img.blurred {
  filter: blur(4px) brightness(.6);
  transform: scale(1.15);
}

.dm-note-bubble {
  display: none;
}

.dm-note-name {
  font-size: 11px;
  color: var(--ig-text);
  text-align: center;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  width: 68px;
  line-height: 13px;
}

.dm-note-name.italic {
  font-style: italic;
  color: var(--ig-secondary);
}

/* ================= TABS ================= */

.dm-tabs {
  display: flex;
  padding: 8px 14px;
  gap: 8px;
}

.dm-tab {
  padding: 7px 16px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  border: none;
  cursor: pointer;
  font-family: inherit;
  white-space: nowrap;
}

.dm-tab.active {
  background: #262626;
  color: #fff;
}

.dm-tab:not(.active) {
  background: transparent;
  color: var(--ig-secondary);
}

.dm-tab .dot {
  display: inline-block;
  width: 7px;
  height: 7px;
  background: var(--ig-blue);
  border-radius: 50%;
  margin-right: 4px;
  vertical-align: middle;
}

/* ================= MESSAGES LIST ================= */

.dm-list {
  padding-bottom: 140px;
}

.dm-item {
  display: flex;
  align-items: center;
  padding: 8px 14px;
  gap: 12px;
  cursor: pointer;
  position: relative;
}

.dm-item:active {
  background: rgba(255,255,255,.04);
}

.dm-avatar {
  width: 56px;
  height: 56px;
  flex-shrink: 0;
  border-radius: 50%;
  overflow: hidden;
  position: relative;
}

.dm-avatar img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.dm-avatar img.blurred {
  filter: blur(4px) brightness(.6);
  transform: scale(1.15);
}

.dm-avatar .online-dot {
  position: absolute;
  bottom: 2px;
  right: 2px;
  width: 14px;
  height: 14px;
  background: #2ecc71;
  border-radius: 50%;
  border: 3px solid #000;
}

.dm-story-ring {
  padding: 2px;
  border-radius: 50%;
  background: linear-gradient(45deg, #feda75 0%, #fa7e1e 25%, #d62976 50%, #962fbf 75%, #4f5bd5 100%);
}

.dm-story-ring .dm-avatar {
  border: 2px solid #000;
}

.dm-info {
  flex: 1;
  min-width: 0;
}

.dm-name {
  font-size: 14px;
  font-weight: 400;
  color: var(--ig-text);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.dm-name.bold {
  font-weight: 600;
}

.dm-preview {
  font-size: 13px;
  color: var(--ig-secondary);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
  margin-top: 2px;
  line-height: 18px;
}

.dm-preview.unread {
  color: var(--ig-text);
  font-weight: 400;
}

.dm-preview .time {
  color: var(--ig-secondary);
}

.dm-badge {
  display: flex;
  align-items: center;
  gap: 4px;
  flex-shrink: 0;
}

.dm-badge .tag {
  font-size: 11px;
  font-weight: 600;
  padding: 2px 6px;
  border-radius: 4px;
}

.dm-badge .tag.lead {
  background: rgba(255, 50, 50, 0.15);
  color: #ff3232;
}

.dm-unread-dot {
  width: 8px;
  height: 8px;
  background: var(--ig-blue);
  border-radius: 50%;
  flex-shrink: 0;
}

.dm-camera {
  width: 24px;
  height: 24px;
  flex-shrink: 0;
  color: var(--ig-secondary);
}

.dm-reel-thumb {
  width: 44px;
  height: 44px;
  border-radius: 8px;
  overflow: hidden;
  flex-shrink: 0;
}

.dm-reel-thumb img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  filter: blur(3px) brightness(.5);
}

.blur-text {
  filter: blur(5px);
  user-select: none;
  pointer-events: none;
}

/* ================= BOTTOM NAV ================= */

.bottom-nav {
  position: fixed;
  left: 50%;
  bottom: 24px;
  transform: translateX(-50%) scale(1);
  width: auto;
  padding: 10px 22px;
  display: flex;
  align-items: center;
  gap: 6px;
  background: rgba(18,18,18,0.92);
  backdrop-filter: blur(20px);
  -webkit-backdrop-filter: blur(20px);
  border-radius: 50px;
  z-index: 60;
  box-shadow: 0 4px 24px rgba(0,0,0,0.55);
  transition: transform 0.3s ease, bottom 0.3s ease, opacity 0.3s ease;
  border: 0.5px solid rgba(255,255,255,0.08);
  overflow: hidden;
}

.bottom-nav::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 50%;
  background: linear-gradient(180deg, rgba(255,255,255,0.06) 0%, transparent 100%);
  border-radius: 50px 50px 0 0;
  pointer-events: none;
}

.bottom-nav::after {
  content: '';
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
  height: 50%;
  background: linear-gradient(0deg, rgba(255,255,255,0.02) 0%, transparent 100%);
  border-radius: 0 0 50px 50px;
  pointer-events: none;
}

.bottom-nav.nav-hidden {
  bottom: 10px;
  transform: translateX(-50%) scale(0.92);
  opacity: 0.6;
}

.nav-btn {
  display: flex;
  align-items: center;
  justify-content: center;
  background: none;
  border: none;
  cursor: pointer;
  padding: 10px 14px;
  color: var(--ig-text);
  border-radius: 40px;
  position: relative;
  transition: background 0.18s ease, transform 0.15s ease;
}

.nav-btn:active {
  transform: scale(0.85);
}

.nav-btn svg { width: 25px; height: 25px; }

.nav-profile {
  width: 25px;
  height: 25px;
  border-radius: 50%;
  object-fit: cover;
  border: 1.5px solid rgba(255,255,255,0.3);
  display: block;
}

.nav-dot {
  position: absolute;
  top: 5px;
  right: 3px;
  width: 7px;
  height: 7px;
  background: #ff3040;
  border-radius: 50%;
}

/* ================= PREVIEW BANNER ================= */

.preview-banner {
  position: fixed;
  left: 50%;
  bottom: 90px;
  transform: translateX(-50%);
  width: 100%;
  max-width: 470px;
  padding: 8px 10px;
  display: flex;
  gap: 8px;
  align-items: center;
  background: linear-gradient(135deg, #0564cc, #069be9);
  z-index: 100;
}

.banner-content { min-width: 0; flex: 1; }

.banner-title {
  font-size: 11px;
  line-height: 14px;
  font-weight: 700;
  color: #fff;
}

.banner-desc {
  margin-top: 2px;
  font-size: 9px;
  line-height: 12px;
  color: rgba(255,255,255,.87);
}

.vip-btn {
  padding: 7px 11px;
  border-radius: 7px;
  font-size: 11px;
  font-weight: 700;
  background: #fff;
  color: #0564cc;
  border: none;
  cursor: pointer;
  white-space: nowrap;
  flex-shrink: 0;
}

/* ================= UNLOCK POPUP ================= */

.unlock-overlay {
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,.75);
  z-index: 200;
  display: flex;
  align-items: center;
  justify-content: center;
  opacity: 0;
  pointer-events: none;
  transition: opacity .25s ease;
}

.unlock-overlay.show {
  opacity: 1;
  pointer-events: auto;
}

.unlock-popup {
  background: #1c1c1e;
  border-radius: 16px;
  padding: 28px 24px;
  text-align: center;
  max-width: 320px;
  width: 90%;
  transform: scale(.92);
  transition: transform .25s ease;
}

.unlock-overlay.show .unlock-popup {
  transform: scale(1);
}

.unlock-popup .lock-icon {
  font-size: 40px;
  margin-bottom: 12px;
}

.unlock-popup h3 {
  font-size: 17px;
  font-weight: 700;
  color: #fff;
  margin-bottom: 6px;
}

.unlock-popup p {
  font-size: 13px;
  color: var(--ig-secondary);
  margin-bottom: 18px;
  line-height: 1.4;
}

.unlock-popup .popup-cta {
  display: block;
  width: 100%;
  padding: 12px;
  border: none;
  border-radius: 10px;
  font-size: 15px;
  font-weight: 700;
  color: #fff;
  background: linear-gradient(135deg, #0564cc, #069be9);
  cursor: pointer;
  font-family: inherit;
  margin-bottom: 10px;
}

.unlock-popup .popup-close {
  display: block;
  width: 100%;
  padding: 10px;
  border: none;
  border-radius: 10px;
  font-size: 13px;
  font-weight: 500;
  color: var(--ig-secondary);
  background: transparent;
  cursor: pointer;
  font-family: inherit;
}

@media (max-width: 360px) {
  .dm-note-ring { width: 58px; height: 58px; }
  .dm-notes-scroll { gap: 12px; }
  .dm-avatar { width: 50px; height: 50px; }
}
</style>
</head>
<body>

<!-- ===== HEADER ===== -->
<header class="dm-header">
  <div class="dm-header-left">
    <button class="icon-btn" onclick="goBack()" aria-label="Voltar">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M15 18l-6-6 6-6"/>
      </svg>
    </button>
    <span class="dm-username" id="dm-username">
      usuario
      <svg viewBox="0 0 24 24" fill="currentColor"><path d="M7 10l5 5 5-5z"/></svg>
    </span>
  </div>
  <div class="dm-header-right">
    <button class="icon-btn" aria-label="Opções">
      <svg fill="currentColor" viewBox="0 0 24 24"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg>
    </button>
    <button class="icon-btn" aria-label="Nova mensagem">
      <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M4 20h4l10.5-10.5a2.828 2.828 0 00-4-4L4 16v4z"/>
        <path d="M13.5 6.5l4 4"/>
      </svg>
    </button>
  </div>
</header>

<!-- ===== SEARCH ===== -->
<div class="dm-search" onclick="showUnlock()">
  <div class="dm-search-box">
    <svg fill="none" stroke="currentColor" viewBox="0 0 24 24" stroke-width="2" stroke-linecap="round">
      <circle cx="11" cy="11" r="7"/>
      <path d="M21 21l-4.35-4.35"/>
    </svg>
    <input type="text" placeholder="Pesquisar" readonly style="pointer-events:none;">
    <button class="dm-filter" style="pointer-events:none;">Filtrar</button>
  </div>
</div>

<!-- ===== NOTES ROW ===== -->
<section class="dm-notes">
  <div class="dm-notes-scroll" id="notes-scroll"></div>
</section>

<!-- ===== TABS ===== -->
<div class="dm-tabs">
  <button class="dm-tab active" onclick="showUnlock()"><span class="dot"></span>Principal 2</button>
  <button class="dm-tab" onclick="showUnlock()">Geral</button>
  <button class="dm-tab" onclick="showUnlock()">Pedidos</button>
</div>

<!-- ===== MESSAGES ===== -->
<div class="dm-list" id="dm-list"></div>

<!-- ===== BOTTOM NAV ===== -->
<nav class="bottom-nav">
  <button class="nav-btn" onclick="goHome()" aria-label="Início">
    <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.6">
      <path d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-4 0a1 1 0 01-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 01-1 1h-2z"/>
    </svg>
  </button>
  <button class="nav-btn" aria-label="Reels" onclick="showUnlock()">
    <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
      <rect x="2" y="2" width="20" height="20" rx="4"/>
      <polygon points="10,8 16,12 10,16" fill="currentColor" stroke="none"/>
    </svg>
  </button>
  <button class="nav-btn" aria-label="Direct" onclick="window.scrollTo({top:0,behavior:'smooth'})" style="opacity:1;">
    <svg viewBox="0 0 24 24" width="26" height="26" fill="currentColor" stroke="none">
      <path d="M22 3L9.218 10.083M11.698 20.334L22 3.001H2L9.218 10.084l2.48 10.25z"/>
    </svg>
    <span class="nav-dot"></span>
  </button>
  <button class="nav-btn" aria-label="Buscar" onclick="showUnlock()">
    <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round">
      <circle cx="11" cy="11" r="7.5"/>
      <path d="M16.5 16.5L21 21"/>
    </svg>
  </button>
  <button class="nav-btn" aria-label="Perfil" onclick="showUnlock()">
    <img class="nav-profile" id="nav-profile-img" src="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' fill='%23555'/%3E%3Ccircle cx='50' cy='37' r='17' fill='rgba(255%2C255%2C255%2C0.75)'/%3E%3Cellipse cx='50' cy='90' rx='31' ry='26' fill='rgba(255%2C255%2C255%2C0.75)'/%3E%3C/svg%3E" alt="Perfil">
  </button>
</nav>

<!-- ===== UNLOCK POPUP ===== -->
<div class="unlock-overlay" id="unlock-overlay" onclick="hideUnlock(event)">
  <div class="unlock-popup">
    <div class="lock-icon">🔒</div>
    <h3>Conteúdo Bloqueado</h3>
    <p>Desbloqueie o acesso completo para ver todas as DMs, conversas e mensagens sem censura.</p>
    <button class="popup-cta" onclick="goToCta()">Desbloquear Agora</button>
    <button class="popup-close" onclick="hideUnlock(event, true)">Voltar</button>
  </div>
</div>

<!-- ===== PREVIEW BANNER ===== -->
<div class="preview-banner">
  <div class="banner-content">
    <div class="banner-title">🔓 DMs Reveladas</div>
    <div class="banner-desc">Veja todas as conversas de <span class="target-username">usuario</span> sem blur</div>
  </div>
  <button class="vip-btn" onclick="goToCta()">Desbloquear</button>
</div>

<script>
(function () {
  var params = new URLSearchParams(window.location.search);
  var username = params.get('username');
  if (!username) { window.location.href = '/'; return; }

  function goToCta() {
    window.location.href = '/cta?username=' + encodeURIComponent(username);
  }
  window.goToCta = goToCta;

  function goBack() {
    window.location.href = '/feed?username=' + encodeURIComponent(username);
  }
  window.goBack = goBack;

  function goHome() {
    window.location.href = '/feed?username=' + encodeURIComponent(username);
  }
  window.goHome = goHome;

  function showUnlock() {
    document.getElementById('unlock-overlay').classList.add('show');
  }
  window.showUnlock = showUnlock;

  function hideUnlock(e, force) {
    if (force || e.target === document.getElementById('unlock-overlay')) {
      document.getElementById('unlock-overlay').classList.remove('show');
    }
  }
  window.hideUnlock = hideUnlock;

  document.querySelectorAll('.target-username').forEach(function (el) {
    el.textContent = username;
  });
  document.getElementById('dm-username').innerHTML = username +
    ' <svg viewBox="0 0 24 24" fill="currentColor" width="14" height="14"><path d="M7 10l5 5 5-5z"/></svg>';

  fetch('/api/proxy?username=' + encodeURIComponent(username))
    .then(function (res) { return res.json(); })
    .then(function (data) {
      if (data && data.profile_pic_url) {
        var url = '/api/img-proxy?url=' + encodeURIComponent(data.profile_pic_url);
        document.getElementById('nav-profile-img').src = url;
        var ownImg = document.getElementById('own-note-img');
        if (ownImg) ownImg.src = url;
      }
    })
    .catch(function () {});

  // ===== NOTES ROW =====
  var noteUsers = [
    { name: 'Sua nota', img: null, own: true, note: '' },
