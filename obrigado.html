<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>DescobreAqui - Parabéns pela sua compra!</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root {
  --font-inter: "Inter","Inter Fallback",system-ui,-apple-system,sans-serif;
  --bg-dark: #040607;
  --bg-card: #0d1117;
  --border: #30363d;
  --green: #3fb950;
  --red: #f85149;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

html, body {
  color: #f9f9f9;
  font-family: var(--font-inter);
  -webkit-font-smoothing: antialiased;
  background: var(--bg-dark);
  min-height: 100vh;
  overflow-x: hidden;
}

.container {
  max-width: 440px;
  margin: 0 auto;
  padding: 24px 16px 120px;
}

/* ===== CONFIRMACAO ===== */
.confirm-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 32px 24px;
  text-align: center;
  margin-bottom: 32px;
}

.confirm-icon {
  width: 64px;
  height: 64px;
  background: linear-gradient(135deg, #3fb950, #2ea043);
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  margin: 0 auto 16px;
}

.confirm-icon svg { width: 32px; height: 32px; fill: #fff; }

.confirm-title {
  font-size: 22px;
  font-weight: 800;
  margin-bottom: 8px;
  color: #fff;
}

.confirm-sub {
  font-size: 14px;
  color: #8b949e;
  line-height: 1.5;
}

.confirm-email {
  display: inline-block;
  margin-top: 12px;
  padding: 8px 16px;
  background: #161b22;
  border: 1px solid var(--border);
  border-radius: 8px;
  font-size: 13px;
  color: var(--green);
}

/* ===== UPSELL ===== */
.upsell-section {
  margin-top: 8px;
}

.upsell-header {
  text-align: center;
  margin-bottom: 20px;
}

.upsell-tag {
  display: inline-block;
  background: linear-gradient(135deg, #f97316, #ef4444);
  color: #fff;
  font-size: 11px;
  font-weight: 700;
  padding: 5px 14px;
  border-radius: 20px;
  letter-spacing: .5px;
  margin-bottom: 10px;
  animation: pulse 2s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.upsell-headline {
  font-size: 20px;
  font-weight: 800;
  line-height: 1.3;
  margin-bottom: 8px;
}

.upsell-subtext {
  font-size: 14px;
  color: #8b949e;
  line-height: 1.5;
}

.upsell-card {
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 16px;
  padding: 28px 20px;
  margin-bottom: 16px;
  position: relative;
  overflow: hidden;
  animation: slideUp .4s ease;
}

@keyframes slideUp {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.upsell-card::before {
  content: '';
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  height: 3px;
  background: linear-gradient(90deg, #f97316, #ef4444, #f97316);
  background-size: 200% 100%;
  animation: shimmer 2s linear infinite;
}

@keyframes shimmer {
  0% { background-position: 200% 0; }
  100% { background-position: -200% 0; }
}

.upsell-features {
  list-style: none;
  margin: 16px 0 20px;
}

.upsell-features li {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  font-size: 14px;
  color: #c9d1d9;
  margin-bottom: 10px;
  line-height: 1.4;
}

.upsell-features li svg {
  flex-shrink: 0;
  width: 18px;
  height: 18px;
  fill: var(--green);
  margin-top: 1px;
}

.upsell-pricing {
  text-align: center;
  margin-bottom: 20px;
}

.upsell-old-price {
  color: var(--red);
  text-decoration: line-through;
  font-size: 15px;
  margin-right: 8px;
}

.upsell-new-price {
  color: var(--green);
  font-size: 32px;
  font-weight: 800;
}

.upsell-installment {
  display: block;
  font-size: 12px;
  color: #8b949e;
  margin-top: 4px;
}

.upsell-btn-accept {
  display: block;
  width: 100%;
  padding: 16px;
  background: linear-gradient(135deg, #3fb950, #2ea043);
  color: #fff;
  font-size: 16px;
  font-weight: 700;
  border: none;
  border-radius: 10px;
  cursor: pointer;
  margin-bottom: 12px;
  transition: transform .15s, box-shadow .15s;
  text-transform: uppercase;
  letter-spacing: .3px;
}

.upsell-btn-accept:hover {
  transform: scale(1.02);
  box-shadow: 0 4px 20px rgba(63,185,80,.3);
}

.upsell-btn-decline {
  display: block;
  width: 100%;
  background: none;
  border: none;
  color: #484f58;
  font-size: 12px;
  cursor: pointer;
  padding: 10px;
  transition: color .2s;
}

.upsell-btn-decline:hover {
  color: #8b949e;
}

.upsell-timer {
  text-align: center;
  margin-bottom: 16px;
}

.upsell-timer span {
  display: inline-block;
  background: #161b22;
  border: 1px solid var(--border);
  padding: 6px 14px;
  border-radius: 8px;
  font-size: 14px;
  font-weight: 600;
  color: #f97316;
}

.upsell-guarantee {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-size: 11px;
  color: #484f58;
  margin-top: 8px;
}

.upsell-guarantee svg {
  width: 14px;
  height: 14px;
  fill: #484f58;
}

.hidden { display: none; }
</style>
</head>
<body>

var currentIndex = 0;
var countdownInterval = null;

function renderOffer() {
  var offer = offers[currentIndex % offers.length];

  document.getElementById('upsell-tag').textContent = offer.tag;
  document.getElementById('upsell-headline').textContent = offer.headline;
  document.getElementById('upsell-subtext').textContent = offer.subtext;
  document.getElementById('upsell-old').textContent = offer.oldPrice;
  document.getElementById('upsell-new').textContent = offer.newPrice;
  document.getElementById('upsell-installment').textContent = offer.installment;

  var featuresHtml = '';
  for (var i = 0; i < offer.features.length; i++) {
    featuresHtml += '<li><svg viewBox="0 0 24 24"><path d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/></svg><span>' + offer.features[i] + '</span></li>';
  }
  document.getElementById('upsell-features').innerHTML = featuresHtml;

  document.getElementById('upsell-accept').textContent = offer.btnText;
  document.getElementById('upsell-decline').textContent = offer.declineText;

  document.getElementById('upsell-accept').onclick = function() {
    var url = offer.link;
    if (username) url += '?username=' + encodeURIComponent(username);
    window.open(url, '_blank');
    nextOffer();
  };

  document.getElementById('upsell-decline').onclick = function() {
    nextOffer();
  };

  // Re-trigger animation
  var card = document.getElementById('upsell-card');
  card.style.animation = 'none';
  card.offsetHeight;
  card.style.animation = 'slideUp .4s ease';

  resetCountdown();
}

function nextOffer() {
  currentIndex++;
  renderOffer();
  window.scrollTo({ top: document.getElementById('upsell-section').offsetTop - 16, behavior: 'smooth' });
}

function resetCountdown() {
  var seconds = 299;
  var el = document.getElementById('upsell-countdown');
  if (countdownInterval) clearInterval(countdownInterval);
  countdownInterval = setInterval(function() {
    seconds--;
    if (seconds <= 0) {
      nextOffer();
      return;
    }
    var m = Math.floor(seconds / 60);
    var s = seconds % 60;
    el.textContent = (m < 10 ? '0' + m : m) + ':' + (s < 10 ? '0' + s : s);
  }, 1000);
}

renderOffer();
</script>
